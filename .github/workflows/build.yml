
name: Build FastonyxTournament

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: |
          unzip -o FastonyxTournament-Paper-1.21.11-source.zip -d source
          cd source/TournamentPaper
          mvn --batch-mode clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FastonyxTournament-JAR
          path: source/TournamentPaper/target/tournament-1.0.0.jar
          if-no-files-found: error
